<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.2/css/academicons.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {%- feed_meta -%}
  {%- seo -%}
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <nav class="site-nav" aria-label="primary">
        <div class="nav-icons">
          <a href="https://scholar.google.com/citations?user=oiIdJcgAAAAJ&hl=en" title="Google Scholar" aria-label="Google Scholar" target="_blank" rel="noopener"><i class="ai ai-google-scholar"></i></a>
          <a href="https://github.com/vanIvan" title="GitHub" aria-label="GitHub" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i></a>
          <a href="https://www.linkedin.com/in/ivan-iakovlev/" title="LinkedIn" aria-label="LinkedIn" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin"></i></a>
          <a href="https://www.kaggle.com/ivanid" title="Kaggle" aria-label="Kaggle" target="_blank" rel="noopener"><i class="fa-brands fa-kaggle"></i></a>
          <a href="mailto:ivan@iyakovlev.dev" title="Email" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
          <a href="{{ '/references/Ivan%20Yakovlev%20CV.pdf' | relative_url }}" title="Curriculum Vitae" aria-label="CV (PDF)" target="_blank" rel="noopener"><i class="fa-solid fa-file-lines"></i></a>
        </div>
        <div class="nav-links">
          <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}">about</a>
          <a href="{{ '/blog/' | relative_url }}" class="nav-link{% if page.url contains '/blog' %} active{% endif %}">blog</a>
          <a href="{{ '/publications/' | relative_url }}" class="nav-link{% if page.url contains '/publications' %} active{% endif %}">publications</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="page-content" id="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© {{ site.time | date: "%Y" }} Ivan Yakovlev · built with <a href="https://jekyllrb.com">Jekyll</a></p>
  </footer>
</body>
</html>
